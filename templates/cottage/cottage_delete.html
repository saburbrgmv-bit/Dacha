<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O'chirishni tasdiqlang — Dacha.uz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --pine-950:#132720;
      --pine-800:#1E3B2C;
      --pine-700:#28503C;
      --lake-500:#3E7A96;
      --gold-500:#D6A354;
      --sand-50:#FAF6EC;
      --sand-100:#F2ECDC;
      --stone-200:#E7DFCB;
      --ink-900:#1B231D;
      --ink-600:#4B5750;
      --paper:#FFFDF8;
      --danger-500:#C1503F;
      --danger-600:#A8402F;
      --danger-50:#FBEEEC;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;min-height:100vh;
      font-family:'Manrope',sans-serif;color:var(--ink-900);
      background:
        radial-gradient(ellipse 800px 500px at 50% 0%, rgba(193,80,63,0.16), transparent 60%),
        linear-gradient(180deg,var(--pine-950) 0%, var(--pine-800) 42%, var(--sand-50) 42%);
      display:flex;align-items:center;justify-content:center;
      padding:100px 20px 60px;
      -webkit-font-smoothing:antialiased;
    }
    h1,h2{font-family:'Fraunces',serif;font-weight:600;margin:0;letter-spacing:-0.01em;}
    a{color:inherit;}

    .top-logo{
      position:fixed;top:26px;left:32px;z-index:5;
      display:flex;align-items:center;gap:9px;
      color:var(--sand-50);font-family:'Fraunces',serif;font-weight:600;font-size:19px;
      text-decoration:none;
    }
    .back-link{
      position:fixed;top:28px;right:32px;z-index:5;
      color:rgba(250,246,236,0.75);font-size:13.5px;font-weight:600;
      display:flex;align-items:center;gap:6px;text-decoration:none;
    }
    .back-link:hover{color:var(--sand-50);}

    .card{
      position:relative;z-index:2;
      width:100%;max-width:480px;
      background:var(--paper);
      border-radius:26px;
      box-shadow:0 30px 70px rgba(19,39,32,0.28);
      padding:44px 42px 38px;
      text-align:center;
    }
    .icon-ring{
      width:66px;height:66px;border-radius:50%;
      background:var(--danger-50);color:var(--danger-500);
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 22px;
    }
    .card h2{font-size:24px;margin-bottom:10px;}
    .card .sub{font-size:14.5px;line-height:1.6;color:var(--ink-600);margin:0 auto 6px;max-width:360px;}
    .card .sub strong{color:var(--ink-900);}

    .warn-note{
      margin:20px 0 26px;background:var(--danger-50);border:1px solid rgba(193,80,63,0.25);
      border-radius:12px;padding:13px 16px;font-size:13px;color:var(--danger-600);
      text-align:left;display:flex;gap:10px;align-items:flex-start;line-height:1.55;
    }
    .warn-note svg{flex:none;margin-top:1px;}

    /* ---- Django form.as_p styling (in case the view passes extra fields) ---- */
    form p{margin:0 0 16px;text-align:left;}
    form label{
      display:block;font-size:11.5px;font-weight:700;letter-spacing:0.07em;
      text-transform:uppercase;color:var(--ink-600);margin-bottom:7px;
    }
    form input[type="text"],
    form input[type="password"],
    form select,
    form textarea{
      width:100%;border:1.5px solid var(--stone-200);background:var(--sand-50);
      border-radius:10px;padding:11px 14px;font-size:14.5px;font-family:inherit;
      color:var(--ink-900);appearance:none;
    }
    form input:focus,form select:focus,form textarea:focus{outline:none;border-color:var(--lake-500);}
    form ul.errorlist{
      list-style:none;margin:6px 0 0;padding:0;
      color:var(--danger-600);font-size:12.5px;font-weight:600;text-align:left;
    }

    .form-actions{display:flex;gap:12px;margin-top:8px;}
    button[type="submit"]{
      flex:1;background:var(--danger-500);color:var(--sand-50);
      border:none;border-radius:10px;padding:14px;font-weight:700;font-size:15px;
      font-family:inherit;cursor:pointer;
      transition:background .2s, transform .2s;
    }
    button[type="submit"]:hover{background:var(--danger-600);transform:translateY(-1px);}
    .btn-cancel{
      flex:1;background:var(--sand-100);color:var(--ink-900);
      border:none;border-radius:10px;padding:14px;font-weight:700;font-size:14.5px;
      font-family:inherit;cursor:pointer;text-decoration:none;
      display:flex;align-items:center;justify-content:center;transition:background .2s;
    }
    .btn-cancel:hover{background:var(--stone-200);}

    @media (max-width:520px){
      .card{padding:36px 26px 30px;}
    }
  </style>
</head>
<body>

  <a href="{% url 'cottage_list' %}" class="top-logo">
    <svg width="24" height="24" viewBox="0 0 26 26" fill="none"><path d="M2 20L9 8L13 15L17 6L24 20" stroke="#D6A354" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Dacha.uz
  </a>
  <a href="{% url 'cottage_list' %}" class="back-link">
    ← Bosh sahifaga qaytish
  </a>

  <div class="card">
    <div class="icon-ring">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M3 6H21M8 6V4C8 3.4 8.4 3 9 3H15C15.6 3 16 3.4 16 4V6M19 6L18.3 19C18.2 20.1 17.3 21 16.1 21H7.9C6.7 21 5.8 20.1 5.7 19L5 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11V16M14 11V16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </div>

    <h2>O'chirishni tasdiqlaysizmi?</h2>
    <p class="sub">Bu amalni <strong>ortga qaytarib bo'lmaydi</strong>. Ma'lumot butunlay o'chiriladi va uni qayta tiklash imkonsiz.</p>

    <div class="warn-note">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 9V13M12 17H12.01M10.29 3.86L1.82 18A2 2 0 0 0 3.55 21H20.45A2 2 0 0 0 22.18 18L13.71 3.86A2 2 0 0 0 10.29 3.86Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      O'chirilgandan so'ng bog'liq rasm va bronlar ham tiklanmaydi.
    </div>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <a href="{% url 'cottage_list' %}" class="btn-cancel">Bekor qilish</a>
        <button type="submit">O'chirish</button>
      </div>
    </form>
  </div>

</body>
</html>
