<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharh Qoldirish — Dacha.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pine-900: #0f2137;
    --sand-50: #FAF6EC;
    --sand-100: #F2ECDC;
    --stone-200: #E7DFCB;
    --ink-900: #12351a;
    --gold-500: #D6A354;
    --radius-lg: 20px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--sand-50);
    color: var(--ink-900);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  h1, h2 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0; }
  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 600px; margin: 40px auto; padding: 0 20px; width: 100%; }

  /* HEADER / NAV */
  header {
    background: rgba(19, 39, 32, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 70px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px;
  }
  nav h2 a { color: var(--sand-50); font-size: 18px; }

  /* KARTA STILI */
  .form-card {
    background: #ffffff;
    border-radius: var(--radius-lg);
    padding: 32px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 10px 25px rgba(0,0,0,0.04);
  }
  .form-card h1 {
    font-size: 24px;
    color: var(--pine-900);
    margin-bottom: 8px;
  }
  .form-card p {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 24px;
  }

  /* FORMA ELEMENTLARI */
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    color: #475569;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-control {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid #cbd5e1;
    font-family: inherit;
    font-size: 14px;
    background: #FAF6EC;
    transition: all 0.2s ease;
  }
  .form-control:focus {
    outline: none;
    border-color: #1B231D;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(27, 35, 29, 0.1);
  }

  .btn-submit {
    width: 100%;
    background: #1B231D;
    color: #ffffff;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 10px;
  }
  .btn-submit:hover {
    background: #2A362D;
  }

  .btn-cancel {
    display: block;
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    font-weight: 700;
    color: #64748b;
  }
  .btn-cancel:hover {
    color: var(--pine-900);
  }

  /* FOOTER */
  footer { background: #1B231D; color: rgba(250,246,236,0.68); padding: 24px 0; text-align: center; font-size: 12px; }
</style>
</head>
<body>

<header>
  <nav>
    <h2><a href="{% url 'cottage_detail' cottages.pk %}">← Ortga qaytish</a></h2>
  </nav>
</header>

<main class="wrap">
  <div class="form-card">
    <h1>Sharh va Baho Qoldirish</h1>
    <p>Dachada dam olishingiz qanday o'tdi? Boshqalar uchun o'z fikringiz va bahongizni ulashing.</p>

    <form method="POST">
      {% csrf_token %}

      {% if form %}
        <div class="form-group">
          <label for="id_rating">Baho (1 dan 5 gacha):</label>
          {{ form.rating }}
        </div>
        <div class="form-group">
          <label for="id_comment">Fikringiz va Izohingiz:</label>
          {{ form.comment }}
        </div>
      {% else %}
        <div class="form-group">
          <label for="rating">Baho / Reyting:</label>
          <select name="rating" id="rating" class="form-control" required>
            <option value="5">⭐⭐⭐⭐⭐ (5 - A'lo)</option>
            <option value="4">⭐⭐⭐⭐ (4 - Yaxshi)</option>
            <option value="3">⭐⭐⭐ (3 - Qoniqarli)</option>
            <option value="2">⭐⭐ (2 - Qoniqarsiz)</option>
            <option value="1">⭐ (1 - Juda yomon)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="comment">Sharhingiz:</label>
          <textarea name="comment" id="comment" rows="5" class="form-control" placeholder="Dacha sharoitlari, tozaligi va xizmat ko'rsatish haqida yozing..." required></textarea>
        </div>
      {% endif %}

      <button type="submit" class="btn-submit">Sharhni Saqlash</button>
      <a href="javascript:history.back()" class="btn-cancel">Bekor qilish</a>
    </form>
  </div>
</main>

<footer>
  © 2026 Dacha.uz. Barcha huquqlar himoyalangan.
</footer>

</body>
</html>
